<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="こよみ帳">
<meta name="theme-color" content="#f7f3ea">
<title>こよみ帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f7f3ea; --paper:#fffdf8; --ink:#2b2622; --sub:#7a7066; --line:#e3dccf;
  --sun:#c4432e; --sat:#2d5f8f; --gold:#b8892b; --accent:#6b4f2a;
  --f:#2f6fa8; --m:#c0466a;
  --fs:1;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}

/* ===== アイコン ===== */
.av{display:inline-block;border-radius:50%;object-fit:cover;vertical-align:middle;flex:none;background:#ddd}
.avt{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;vertical-align:middle;flex:none}
.ev .av,.ev .avt{width:1.15em;height:1.15em;margin-right:2px;font-size:inherit;border:1px solid rgba(255,255,255,.7)}
.whorow{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:13px;font-weight:700;color:var(--sub)}
.seg button .av,.seg button .avt{width:28px;height:28px;margin-right:6px}
.seg button{display:flex;align-items:center;justify-content:center}
#whoIc{display:flex;gap:2px;height:26px;align-items:center}
#whoIc .av,#whoIc .avt{width:26px;height:26px;font-size:13px}
.icgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}
.icgrid .av,.icgrid .avt{width:84px;height:84px;font-size:34px;margin:0 auto 6px;display:flex}
.icgrid .nm{font-weight:700;margin-bottom:6px}
.icgrid .wbtn{height:44px;margin-top:6px;font-size:15px}

/* ===== 背景 ===== */
#bg{position:absolute;inset:0;z-index:0;display:none;background:#000}
#bg img,#bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
body.hasbg #bg{display:block}
body.hasbg #main{z-index:1;background:transparent}
body.hasbg #head,body.hasbg #week{background:rgba(247,243,234,var(--veil))}
body.hasbg #grid{background:rgba(227,220,207,calc(var(--veil) * .8))}
body.hasbg .cell{background:rgba(255,253,248,var(--veil))}
body.hasbg .cell.out{background:rgba(243,239,230,calc(var(--veil) + .08))}
body.hasbg #bar{background:rgba(255,253,248,calc(var(--veil) + .1))}
.bgprev{width:100%;aspect-ratio:16/10;border-radius:12px;object-fit:cover;background:#e9e2d4;display:block;margin-bottom:8px}

/* ===== メイン画面 ===== */
#main{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t)}
#head{height:64px;flex:none;display:grid;grid-template-columns:64px 1fr 64px;align-items:center}
.navbtn{height:56px;width:56px;margin:0 4px;border-radius:50%;font-size:30px;color:var(--accent);display:flex;align-items:center;justify-content:center}
.navbtn:active{background:#ece4d4}
#title{text-align:center;line-height:1.1}
#title .ym{font-size:calc(26px*var(--fs));font-weight:700;letter-spacing:.02em}
#title .ym small{font-size:.6em;font-weight:600;margin-left:2px}
#title .sub{font-size:calc(12px*var(--fs));color:var(--sub);margin-top:2px}
#week{flex:none;display:grid;grid-template-columns:repeat(7,1fr);font-size:calc(13px*var(--fs));font-weight:700;text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
#week div:first-child{color:var(--sun)} #week div:last-child{color:var(--sat)}
#grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);min-height:0;background:var(--line);gap:1px;border-bottom:1px solid var(--line)}
.cell{background:var(--paper);padding:2px 2px 0;overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:0}
.cell.out{background:#f3efe6}.cell.out>*{opacity:.38}
.cell.today{box-shadow:inset 0 0 0 2.5px var(--gold)}
.cell .top{display:flex;align-items:baseline;justify-content:space-between;gap:1px}
.cell .num{font-size:calc(17px*var(--fs));font-weight:700;line-height:1.15}
.cell.today .num{background:var(--gold);color:#fff;border-radius:6px;padding:0 4px}
.cell .rk{font-size:calc(9.5px*var(--fs));color:var(--sub);white-space:nowrap}
.cell .rk.taian{color:var(--sun);font-weight:700}
.cell.sun .num,.cell.hol .num{color:var(--sun)} .cell.sat .num{color:var(--sat)}
.cell.today.sun .num,.cell.today.hol .num,.cell.today.sat .num{color:#fff}
.cell .hn{font-size:calc(8.5px*var(--fs));color:var(--sun);white-space:nowrap;overflow:hidden;text-overflow:clip;line-height:1.2}
.cell .marks{position:absolute;right:2px;bottom:2px;display:flex;gap:2px;align-items:center}
.cell .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.cell .cam{font-size:9px;line-height:1;background:#efe6d3;border-radius:4px;padding:1px 2px;color:var(--accent);font-weight:700}
.ev{font-size:calc(9.5px*var(--fs));line-height:1.25;white-space:nowrap;overflow:hidden;border-radius:3px;padding:0 2px;margin-top:1px;color:#fff}
.more{font-size:calc(9px*var(--fs));color:var(--sub)}
#bar{flex:none;height:64px;position:relative;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line)}
.copy{flex:none;text-align:center;font-size:10px;color:var(--sub);background:var(--paper);padding:0 0 calc(2px + var(--safe-b));line-height:14px}
body.hasbg .copy{background:rgba(255,253,248,calc(var(--veil) + .1))}
.bbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--accent)}
.bbtn .ic{font-size:24px;line-height:1}
.bbtn:active{background:#f0e9db}

/* ===== 重ね画面（共通） ===== */
.sheet{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;padding-top:var(--safe-t);z-index:10}
.sheet.on{display:flex}
.shead{height:60px;flex:none;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;border-bottom:1px solid var(--line);background:var(--paper)}
.shead .t{text-align:center;font-size:18px;font-weight:700}
.hbtn{height:44px;margin:0 8px;border-radius:10px;font-size:16px;font-weight:700;color:var(--accent);display:flex;align-items:center;justify-content:center}
.hbtn:active{background:#ece4d4}
.hbtn.primary{background:var(--accent);color:#fff}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 24px}
.sfoot{flex:none;height:calc(76px + var(--safe-b));padding:10px 12px calc(10px + var(--safe-b));display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--paper);border-top:1px solid var(--line)}
.big{border-radius:14px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;background:#efe6d3;color:var(--accent)}
.big.primary{background:var(--accent);color:#fff}
.big.danger{background:#f6e2dd;color:var(--sun)}
.big:active{filter:brightness(.93)}
.hide{visibility:hidden}

/* 日の詳細 */
.dhead{display:flex;align-items:flex-end;gap:12px}
.dhead .dd{font-size:calc(54px*var(--fs));font-weight:700;line-height:1}
.dhead .dw{font-size:calc(22px*var(--fs));font-weight:700;padding-bottom:4px}
.dhead .dy{font-size:calc(13px*var(--fs));color:var(--sub);padding-bottom:6px}
.dsub{margin-top:8px;font-size:calc(15px*var(--fs));color:var(--sub)}
.dsub b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:calc(14px*var(--fs));padding:5px 10px;border-radius:999px;background:#efe6d3;color:var(--accent);font-weight:700}
.chip.good{background:#f8ecd0;color:#8a5d00}
.chip.bad{background:#ece9e4;color:#6d665e}
.chip.hol{background:#f6e2dd;color:var(--sun)}
.chip.rk{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.chip.rk.taian{border-color:var(--sun);color:var(--sun)}
.sec{margin-top:22px}
.sec h3{font-size:calc(15px*var(--fs));margin:0 0 8px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:6px}
.evrow{display:flex;gap:10px;align-items:stretch;background:var(--paper);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--line)}
.evrow .bar{width:6px;border-radius:3px;flex:none}
.evrow .tm{font-size:calc(14px*var(--fs));color:var(--sub);min-width:52px;font-weight:700}
.evrow .tt{font-size:calc(18px*var(--fs));font-weight:700;word-break:break-all}
.evrow .mm{font-size:calc(14px*var(--fs));color:var(--sub);margin-top:4px;white-space:pre-wrap;word-break:break-all}
.evrow .who{font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:1px 6px;display:inline-block;margin-bottom:3px}
.empty{color:var(--sub);font-size:calc(15px*var(--fs));padding:8px 2px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#e9e2d4;display:block}

/* 予定の入力 */
.fld{margin-bottom:18px}
.fld label{display:block;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:6px}
.inp{width:100%;font:inherit;font-size:19px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);-webkit-user-select:text;user-select:text}
textarea.inp{min-height:90px;resize:none}
.seg{display:flex;background:#ece4d4;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:44px;border-radius:9px;font-size:16px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stamps button{height:48px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);font-size:24px}
.stamps button.on{border-color:var(--accent);background:#f3e9d6}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:40px;height:40px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2>div{min-width:0}
input[type=date].inp,input[type=time].inp{-webkit-appearance:none;appearance:none;min-height:52px;min-width:0}

/* 年月ジャンプ */
#title{cursor:pointer;border-radius:12px;padding:2px 0}
#title:active{background:#ece4d4}
#title .ym .tri{font-size:.5em;color:var(--sub);margin-left:4px;vertical-align:middle}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ybtn{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;position:relative}
.ybtn .y{font-size:calc(22px*var(--fs));font-weight:700}
.ybtn .w{font-size:calc(11.5px*var(--fs));color:var(--sub);margin-top:2px}
.ybtn .c{font-size:calc(11px*var(--fs));color:var(--accent);font-weight:700;margin-top:3px;min-height:1.2em}
.ybtn.on{border-color:var(--gold);background:#fbf3e1}
.ybtn.now{box-shadow:inset 0 0 0 2px var(--gold)}
.ybtn:active{filter:brightness(.94)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbtn{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:14px 4px;text-align:center}
.mbtn .m{font-size:calc(24px*var(--fs));font-weight:700}
.mbtn .w{font-size:calc(11.5px*var(--fs));color:var(--sub)}
.mbtn .c{font-size:calc(11px*var(--fs));color:var(--accent);font-weight:700;min-height:1.2em;margin-top:2px}
.mbtn.now{box-shadow:inset 0 0 0 2px var(--gold)}
.jhint{font-size:calc(14px*var(--fs));color:var(--sub);margin:0 2px 10px}
.jsec{font-size:calc(15px*var(--fs));font-weight:700;color:var(--sub);margin:18px 2px 8px}

/* 写真ビューア */
#viewer{background:#111}
#viewer .shead{background:#111;border-color:#222}
#viewer .shead .t,#viewer .hbtn{color:#eee}
#viewer .vimg{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .sfoot{background:#111;border-color:#222;grid-template-columns:1fr 1fr 1fr}
#viewer .big{background:#2a2a2a;color:#eee}
#viewer .big.danger{background:#3a1f1c;color:#f29a8c}

/* 設定 */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.card h4{margin:0 0 10px;font-size:16px}
.card p{margin:6px 0;font-size:14px;color:var(--sub);line-height:1.6}
.wbtn{width:100%;height:50px;border-radius:12px;background:#efe6d3;color:var(--accent);font-weight:700;font-size:16px;margin-top:8px}
.ver{text-align:center;color:var(--sub);font-size:12px;margin:20px 0 8px}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;padding:8px 0}
.chk input{width:22px;height:22px}

/* ダイアログ */
#dlg{position:absolute;inset:0;background:rgba(40,30,20,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
#dlg.on{display:flex}
#dlg .box{background:var(--paper);border-radius:18px;padding:20px;width:100%;max-width:400px;max-height:80vh;overflow:auto}
#dlg .msg{font-size:17px;line-height:1.6;white-space:pre-wrap}
#dlg .btns{display:grid;gap:10px;margin-top:18px}
#dlg .btns button{height:52px}
#toast{position:absolute;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:rgba(43,38,34,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;z-index:60;display:none;white-space:nowrap}
#busy{position:absolute;inset:0;background:rgba(247,243,234,.85);z-index:70;display:none;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent);text-align:center}
#busy.on{display:flex}
</style>
</head>
<body>
<div id="bg"></div>
<div id="main">
  <div id="head">
    <button class="navbtn" id="prev" aria-label="前の月">‹</button>
    <div id="title"></div>
    <button class="navbtn" id="next" aria-label="次の月">›</button>
  </div>
  <div id="week"><div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div></div>
  <div id="grid"></div>
  <div id="bar">
    <button class="bbtn" id="bToday"><span class="ic">◎</span>今日</button>
    <button class="bbtn" id="bAdd"><span class="ic">＋</span>予定</button>
    <button class="bbtn" id="bPhoto"><span class="ic">📷</span>写真</button>
    <button class="bbtn" id="bWho"><span class="ic" id="whoIc">👥</span><span id="whoTx">ふたり</span></button>
    <button class="bbtn" id="bSet"><span class="ic">⚙︎</span>設定</button>
  </div>
  <div class="copy" id="copy"></div>
</div>

<!-- 日の詳細 -->
<div class="sheet" id="day">
  <div class="shead">
    <button class="hbtn" id="dBack">‹ 戻る</button>
    <div class="t" id="dTitle"></div>
    <div style="display:flex;justify-content:flex-end"><button class="hbtn" id="dPrev" style="width:40px;margin:0">‹</button><button class="hbtn" id="dNext" style="width:40px;margin:0 8px 0 0">›</button></div>
  </div>
  <div class="sbody" id="dBody"></div>
  <div class="sfoot">
    <button class="big primary" id="dAdd">＋ 予定を入れる</button>
    <button class="big" id="dPhoto">📷 写真を入れる</button>
  </div>
</div>

<!-- 予定の入力 -->
<div class="sheet" id="edit">
  <div class="shead">
    <button class="hbtn" id="eCancel">やめる</button>
    <div class="t" id="eTitle">予定</div>
    <button class="hbtn primary" id="eSave">保存</button>
  </div>
  <div class="sbody">
    <div class="fld"><label>なにをする？</label><input class="inp" id="fTitle" placeholder="例）病院、ゴルフ、法事"></div>
    <div class="fld"><label>マーク</label><div class="stamps" id="fStamps"></div></div>
    <div class="fld"><label>だれの予定？</label><div class="seg" id="fOwner"><button data-v="f"></button><button data-v="m"></button></div></div>
    <div class="row2 fld">
      <div><label>日にち</label><input class="inp" type="date" id="fDate"></div>
      <div><label>おわりの日（連日）</label><input class="inp" type="date" id="fEnd"></div>
    </div>
    <div class="fld"><label>時間</label><div class="seg" id="fAllday"><button data-v="1">一日じゅう</button><button data-v="0">時間を決める</button></div></div>
    <div class="row2 fld" id="fTimes">
      <div><label>はじまり</label><input class="inp" type="time" id="fStart"></div>
      <div><label>おわり</label><input class="inp" type="time" id="fStop"></div>
    </div>
    <div class="fld"><label>くりかえし</label><div class="seg" id="fRepeat"><button data-v="none">なし</button><button data-v="week">毎週</button><button data-v="month">毎月</button><button data-v="year">毎年</button></div></div>
    <div class="fld"><label>色</label><div class="colors" id="fColors"></div></div>
    <div class="fld"><label>メモ</label><textarea class="inp" id="fMemo" placeholder="場所や持ち物など"></textarea></div>
  </div>
  <div class="sfoot">
    <button class="big danger" id="eDel">削除する</button>
    <button class="big primary" id="eSave2">保存する</button>
  </div>
</div>

<!-- 年月ジャンプ -->
<div class="sheet" id="jump">
  <div class="shead">
    <button class="hbtn" id="jBack">‹ 戻る</button>
    <div class="t" id="jTitle">年をえらぶ</div>
    <div></div>
  </div>
  <div class="sbody" id="jBody"></div>
  <div class="sfoot">
    <button class="big" id="jYears">年の一覧へ</button>
    <button class="big primary" id="jToday">今月にもどる</button>
  </div>
</div>

<!-- 写真ビューア -->
<div class="sheet" id="viewer">
  <div class="shead">
    <button class="hbtn" id="vBack">‹ 戻る</button>
    <div class="t" id="vTitle"></div>
    <div></div>
  </div>
  <div class="vimg" id="vImg"><img alt=""></div>
  <div class="sfoot">
    <button class="big" id="vPrev">‹ 前</button>
    <button class="big danger" id="vDel">削除</button>
    <button class="big" id="vNext">次 ›</button>
  </div>
</div>

<!-- 設定 -->
<div class="sheet" id="settings">
  <div class="shead">
    <button class="hbtn" id="sBack">‹ 戻る</button>
    <div class="t">設定</div>
    <div></div>
  </div>
  <div class="sbody" id="sBody"></div>
</div>

<div id="dlg"><div class="box"><div class="msg" id="dlgMsg"></div><div id="dlgExtra"></div><div class="btns" id="dlgBtns"></div></div></div>
<div id="toast"></div>
<div id="busy"><div id="busyTx">読み込み中…</div></div>
<input type="file" id="filePhoto" accept="image/*" multiple hidden>
<input type="file" id="fileIcon" accept="image/*" hidden>
<input type="file" id="fileBg" accept="image/*,video/*" hidden>
<input type="file" id="fileCsv" accept=".csv,.txt,.json,text/csv,application/json" hidden>

<script src="koyomi-data.js"></script>
<script src="koyomi.js"></script>
<script>
'use strict';
const VERSION = 'ver 1.04';
const K = window.Koyomi;
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; };
const dnOf = s => { const p = parseYmd(s); return K.dn(p.y, p.m, p.d); };

const WD = '日月火水木金土';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const GOOD = ['一粒万倍日', '天赦日', '寅の日', '巳の日', '己巳の日', '甲子の日', '天恩日'];

// ===== 保存（この端末） =====

// 写真（IndexedDB）
let db;
function idb() {
  return new Promise((res, rej) => {
    if (db) return res(db);
    const r = indexedDB.open('koyomi', 2);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('photos')) { const s = d.createObjectStore('photos', { keyPath: 'id' }); s.createIndex('date', 'date'); } if (!d.objectStoreNames.contains('misc')) d.createObjectStore('misc', { keyPath: 'id' }); };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
}
async function photoPut(p) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('photos', 'readwrite'); t.objectStore('photos').put(p); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function miscGet(id) { const d = await idb(); return new Promise(res => { const r = d.transaction('misc').objectStore('misc').get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); }
async function miscPut(v) { const d = await idb(); return new Promise((res, rej) => { const t = d.transaction('misc', 'readwrite'); t.objectStore('misc').put(v); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function miscDel(id) { const d = await idb(); return new Promise(res => { const t = d.transaction('misc', 'readwrite'); t.objectStore('misc').delete(id); t.oncomplete = res; }); }
async function photoDel(id) { const d = await idb(); return new Promise(res => { const t = d.transaction('photos', 'readwrite'); t.objectStore('photos').delete(id); t.oncomplete = res; }); }
async function photosOn(date) { const d = await idb(); return new Promise(res => { const out = []; const r = d.transaction('photos').objectStore('photos').index('date').openCursor(IDBKeyRange.only(date)); r.onsuccess = () => { const c = r.result; if (c) { out.push(c.value); c.continue(); } else res(out.sort((a, b) => (a.taken || '').localeCompare(b.taken || ''))); }; }); }
async function photoCounts(from, to) { const d = await idb(); return new Promise(res => { const out = {}; const r = d.transaction('photos').objectStore('photos').index('date').openKeyCursor(IDBKeyRange.bound(from, to)); r.onsuccess = () => { const c = r.result; if (c) { out[c.key] = (out[c.key] || 0) + 1; c.continue(); } else res(out); }; }); }
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

// ===== 予定の取り出し（くりかえし・連日を展開） =====
function eventsOn(n) {
  const g = K.fromDn(n); const out = [];
  for (const e of EV) {
    if (e.deleted) continue;
    if (S.show !== 'both' && e.owner !== S.show) continue;
    const s = dnOf(e.date); const len = e.end ? Math.max(0, dnOf(e.end) - s) : 0;
    if (n < s) continue;
    let hit = false;
    const r = e.repeat || 'none';
    for (let k = 0; k <= len && !hit; k++) {
      const base = n - k; if (base < s) break;
      const b = K.fromDn(base), o = K.fromDn(s);
      if (r === 'none') hit = base === s;
      else if (r === 'week') hit = (base - s) % 7 === 0;
      else if (r === 'month') hit = b.d === o.d;
      else if (r === 'year') hit = b.d === o.d && b.m === o.m;
    }
    if (hit) out.push(e);
  }
  return out.sort((a, b) => (a.start || '').localeCompare(b.start || '') || a.title.localeCompare(b.title));
}
const evColor = e => e.color || (e.owner === 'm' ? COLORS[1] : COLORS[0]);
const evLabel = e => (e.stamp || '') + (e.title || '');

// ===== 月の表示 =====
let cur = (() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() + 1 }; })();
const todayStr = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate()); };

async function render() {
  document.documentElement.style.setProperty('--fs', S.fs);
  const { y, m } = cur;
  const ki = K.info(y, m, 15);
  $('#title').innerHTML = `<div class="ym mincho">${y}<small>年</small> ${m}<small>月</small><span class="tri">▼</span></div><div class="sub">${K.wareki(y, m, 15)}　旧暦 ${ki.kyurekiName}ごろ　${K.yearEto(y)}</div>`;
  const first = K.dn(y, m, 1); const w0 = K.fromDn(first).w; const start = first - w0;
  const counts = await photoCounts(strOf(start), strOf(start + 41)).catch(() => ({}));
  const today = todayStr();
  let html = '';
  for (let i = 0; i < 42; i++) {
    const n = start + i; const g = K.fromDn(n); const info = K.info(g.y, g.m, g.d); const s = strOf(n);
    const cls = ['cell']; if (g.m !== m) cls.push('out'); if (g.w === 0) cls.push('sun'); if (g.w === 6) cls.push('sat'); if (info.holiday) cls.push('hol'); if (s === today) cls.push('today');
    const evs = eventsOn(n);
    const maxEv = 3;
    const good = info.rekichu.some(r => r === '天赦日' || r === '一粒万倍日');
    const hn = info.holiday || info.terms[0] || info.events[0] || '';
    html += `<div class="${cls.join(' ')}" data-d="${s}">
      <div class="top"><span class="num">${g.d}</span><span class="rk${info.rokuyo === '大安' ? ' taian' : ''}">${info.rokuyo}</span></div>
      <div class="hn"${info.holiday ? '' : ' style="color:var(--sub)"'}>${esc(hn)}</div>
      ${evs.slice(0, maxEv).map(e => `<div class="ev" style="background:${evColor(e)}">${S.show === 'both' && ICON[e.owner] ? avatar(e.owner) : ''}${esc(evLabel(e))}</div>`).join('')}
      ${evs.length > maxEv ? `<div class="more">ほか${evs.length - maxEv}件</div>` : ''}
      <div class="marks">${counts[s] ? `<span class="cam">📷${counts[s]}</span>` : ''}${S.cellRekichu && good ? '<span class="dot"></span>' : ''}</div>
    </div>`;
  }
  $('#grid').innerHTML = html;
  $('#whoIc').innerHTML = S.show === 'both' ? avatar('f') + avatar('m') : avatar(S.show);
  $('#whoTx').textContent = S.show === 'both' ? 'ふたり' : S.names[S.show];
}
function move(dm) { let { y, m } = cur; m += dm; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } if (y < 2000 || y > 2060) return; cur = { y, m }; render(); }
$('#prev').onclick = () => move(-1);

$('#bToday').onclick = () => { const t = new Date(); cur = { y: t.getFullYear(), m: t.getMonth() + 1 }; render(); };
$('#grid').onclick = e => { const c = e.target.closest('.cell'); if (c) openDay(c.dataset.d); };
// スワイプで月送り
(() => { let x0 = null, y0 = 0; const g = $('#grid');
  g.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  g.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) move(dx < 0 ? 1 : -1); x0 = null; }, { passive: true });

// ===== 年月ジャンプ（いっぺんに遡る） =====
const ETO_ANIMAL = 'ねずみ,うし,とら,うさぎ,たつ,へび,うま,ひつじ,さる,とり,いぬ,いのしし'.split(',');
function evCounts() { // 年ごと・月ごとの予定の数（くりかえしの予定は除く）
  const y = {}, ym = {};
  for (const e of EV) { if (e.deleted || (e.repeat && e.repeat !== 'none')) continue; if (S.show !== 'both' && e.owner !== S.show) continue; const k = e.date.slice(0, 4), k2 = e.date.slice(0, 7); y[k] = (y[k] || 0) + 1; ym[k2] = (ym[k2] || 0) + 1; }
  return { y, ym };
}
async function photoCountsYear() { const c = await photoCounts('2000-01-01', '2060-12-31').catch(() => ({})); const y = {}, ym = {}; for (const k in c) { y[k.slice(0, 4)] = (y[k.slice(0, 4)] || 0) + c[k]; ym[k.slice(0, 7)] = (ym[k.slice(0, 7)] || 0) + c[k]; } return { y, ym }; }
function countTx(ev, ph) { const a = []; if (ev) a.push(`予定${ev}`); if (ph) a.push(`📷${ph}`); return a.join('・'); }
async function openYears() {
  const now = new Date().getFullYear();

}
$('#dBody').onclick = e => {
  const c = e.target.closest('[data-i]'); if (c) { const k = c.dataset.i; alertBox(`【${k}】\n${K.ROKUYO_INFO[k] || K.REKICHU_INFO[k] || ''}`); return; }

// ===== 写真 =====
let photoTarget = null;
function pickPhotos(date) { photoTarget = date; $('#filePhoto').value = ''; $('#filePhoto').click(); }
$('#filePhoto').onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  busy(`写真を入れています… 0 / ${files.length}`);
  const done = {}; const unknown = [];
  for (let i = 0; i < files.length; i++) {
    busy(`写真を入れています… ${i + 1} / ${files.length}`);
    try {
      const f = files[i];
      const taken = photoTarget ? null : await exifDate(f);
      const conv = await resize(f);
      const rec = { id: uid(), date: photoTarget || (taken ? taken.slice(0, 10) : null), taken: taken || '', full: conv.full, thumb: conv.thumb, added: Date.now() };
      if (!rec.date) { unknown.push(rec); continue; }
      await photoPut(rec); done[rec.date] = (done[rec.date] || 0) + 1;
    } catch (err) { console.error(err); }
  }
  busy(false);

async function exifDate(file) {
  try {
    const buf = await file.slice(0, 256 * 1024).arrayBuffer(); const v = new DataView(buf);
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o < v.byteLength - 4) {
      const mk = v.getUint16(o); const len = v.getUint16(o + 2);
      if (mk === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
        const t = o + 10; const le = v.getUint16(t) === 0x4949;
        const u16 = x => v.getUint16(x, le), u32 = x => v.getUint32(x, le);
        const readStr = (off, n) => { let s = ''; for (let i = 0; i < n - 1; i++) s += String.fromCharCode(v.getUint8(t + off + i)); return s; };
        const ifd = (off, want) => { const n = u16(t + off); const r = {}; for (let i = 0; i < n; i++) { const e = t + off + 2 + i * 12; const tag = u16(e); if (want.includes(tag)) r[tag] = { cnt: u32(e + 4), val: u32(e + 8) }; } return r; };
        const i0 = ifd(u32(t + 4), [0x8769, 0x0132]);
        let s = null;
        if (i0[0x8769]) { const ex = ifd(i0[0x8769].val, [0x9003, 0x9004]); const x = ex[0x9003] || ex[0x9004]; if (x) s = readStr(x.val, x.cnt); }
        if (!s && i0[0x0132]) s = readStr(i0[0x0132].val, i0[0x0132].cnt);
        if (s && /^\d{4}:\d\d:\d\d/.test(s)) return s.slice(0, 10).replace(/:/g, '-') + 'T' + s.slice(11, 19);
        return null;
      }
      if ((mk & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch (e) { }
  return null;
}

function parseCsv(t) {
  const rows = []; let row = [], f = '', q = false;
  t = t.replace(/^\uFEFF/, '');
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;

}
function normDate(s) { s = (s || '').trim(); const m = s.match(/(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/); return m ? ymd(+m[1], +m[2], +m[3]) : null; }

function csvToEvents(rows) {
  const hd = rows[0].map(h => h.trim().toLowerCase());
  const find = (...names) => hd.findIndex(h => names.some(n => h === n || h.includes(n)));
  const iDate = find('日付', 'start date', '開始日', 'date');
  const iEnd = find('終了日', 'end date');
  const iStart = find('開始時刻', 'start time', '開始時間', '時刻');
  const iStop = find('終了時刻', 'end time', '終了時間');
  const iTitle = find('タイトル', 'subject', '件名', '予定', 'title');
  const iMemo = find('メモ', 'description', '詳細', '内容', 'memo');
  const iWho = find('だれ', '持ち主', 'owner');
  if (iDate < 0) return [];
  const out = [];
  for (const r of rows.slice(1)) {
    const d = normDate(r[iDate]); if (!d) continue;
    let end = iEnd >= 0 ? normDate(r[iEnd]) : null; if (end && end <= d) end = '';
    const w = iWho >= 0 ? (r[iWho] || '').trim() : '';
    const iRep = find('くりかえし'), iStamp = find('マーク');
    const rep = iRep >= 0 ? ({ '毎週': 'week', '毎月': 'month', '毎年': 'year' }[(r[iRep] || '').trim()] || 'none') : 'none';
    const stamp = iStamp >= 0 ? (r[iStamp] || '').trim() : '';
    out.push({ id: uid(), created: Date.now(), updated: Date.now(), title: (iTitle >= 0 ? r[iTitle] : '').trim() || '（無題）', date: d, end: end || '', start: iStart >= 0 ? normTime(r[iStart]) : '', stop: iStop >= 0 ? normTime(r[iStop]) : '', memo: iMemo >= 0 ? (r[iMemo] || '').trim() : '', repeat: rep, stamp, color: '', owner: w === 'f' || w === S.names.f ? 'f' : w === 'm' || w === S.names.m ? 'm' : '', imported: true });
  }
  return out;
}

// ===== はじめて =====
async function firstRun() {
  if (S.me) return;
  const who = await dialog('こよみ帳へようこそ。\nこのスマホを使うのはどなたですか？\n（次からは、いつもこの人のカレンダーから開きます）', [[S.names.f, 'f', 'primary'], [S.names.m, 'm', 'primary']]);
  S.me = who; S.show = who; saveS(); render();
}
if (S.me) { S.show = S.me; saveS(); }
$('#copy').textContent = `こよみ帳 ${VERSION}　© 2026 bl-oom Inc.`;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
Promise.all([applyBg().catch(() => { }), loadIcons().catch(() => { })]).finally(() => render().then(firstRun));
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#day').classList.contains('on')) render(); });
</script>
</body>
</html>
